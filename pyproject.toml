[project]
name = "atlas-explainer"
version = "0.1.0"
description = "Explainer cards for Code Atlas: a format, a component kit and a lint/pack tool for visual answers that live in .codemap/."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# `atlas-explainer bake`: frame sheets for animations, Vega-Lite → SVG/Vega for charts. Not needed to lint or pack.
media = [
    "pillow>=10",
    "vl-convert-python>=1.7",
    "imageio[ffmpeg]>=2.34",     # only for anim.<name>.video: Manim and friends write a video, not stills
]

[project.scripts]
atlas-explainer = "atlas_explainer.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "atlas_explainer"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pillow>=10",
    "vl-convert-python>=1.7",
]
